spring.application.name=school
server.port=8081

spring.datasource.url=jdbc:h2:mem:school
spring.datasource.driverClassName=org.h2.Driver
# H2 w pamięci — dane logowania bez znaczenia, przy prawdziwej bazie: zmienna środowiskowa
spring.datasource.username=user
spring.datasource.password=password
# H2 w pamięci — schemat od zera przy każdym starcie, przy prawdziwej bazie: validate + migracje (Flyway)
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
